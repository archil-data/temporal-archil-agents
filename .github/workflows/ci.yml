name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # The lifecycle tests skip themselves when these aren't configured.
      ARCHIL_API_KEY: ${{ secrets.ARCHIL_API_KEY }}
      ARCHIL_REGION: ${{ vars.ARCHIL_REGION || 'aws-us-west-2' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[test]"
      - name: Workflow tests (stub activities) and sandbox lifecycle tests (live Archil API)
        run: pytest -v -rs --log-cli-level=INFO
