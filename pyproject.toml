[project]
name = "archil-temporal-agents"
version = "0.1.0"
description = "Run each Temporal activity as a Claude agent in its own Archil sandbox"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "archil>=0.21.0",
    "temporalio>=1.36",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23", "pyarrow>=17"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["archil_temporal"]
